<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} | {{ .Site.Title }}</title>
  <style>
    body { font-family: sans-serif; line-height: 1.7; max-width: 760px; margin: 0 auto; padding: 20px; color: #333; background: #fafafa; }
    header { border-bottom: 2px solid #ddd; padding-bottom: 10px; margin-bottom: 20px; }
    header a { text-decoration: none; color: #111; font-weight: bold; font-size: 1.2rem; }
    article { background: #fff; padding: 25px; border-radius: 8px; border: 1px solid #e2e8f0; }
    h1 { font-size: 1.5rem; margin-top: 0; }
    h2 { font-size: 1.25rem; border-left: 4px solid #0066cc; padding-left: 10px; margin-top: 25px; }
    .date { color: #666; font-size: 0.9rem; }
    .affiliate-box { margin-top: 35px; padding: 18px; background: #fff8e6; border: 2px solid #ffd166; border-radius: 8px; }
    .affiliate-box h3 { margin-top: 0; color: #b36b00; font-size: 1.1rem; }
  </style>
</head>
<body>
  <header><a href="/">{{ .Site.Title }}</a></header>
  <article>
    <p class="date">{{ .Date.Format "2006年01月02日" }}</p>
    <h1>{{ .Title }}</h1>
    <div>{{ .Content }}</div>

    <!-- 全記事に自動で出る収益化・アフィリエイト枠 -->
    <div class="affiliate-box">
      <h3>🔥 クリエイター＆同人ファン向けおすすめ情報</h3>
      <ul>
        <li><a href="https://www.dlsite.com/" target="_blank" rel="noopener">【DLsite】開催中の割引キャンペーン・ランキングを見る</a></li>
        <li><a href="https://www.amazon.co.jp/" target="_blank" rel="noopener">【Amazon】同人作業が捗るおすすめガジェット・書籍特集</a></li>
      </ul>
    </div>
  </article>
</body>
</html>
