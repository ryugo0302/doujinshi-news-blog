<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Site.Title }}</title>
  <style>
    body { font-family: sans-serif; line-height: 1.7; max-width: 760px; margin: 0 auto; padding: 20px; color: #333; background: #fafafa; }
    h1 { border-bottom: 2px solid #333; padding-bottom: 10px; font-size: 1.6rem; }
    .post-list { list-style: none; padding: 0; }
    .post-list li { background: #fff; margin-bottom: 10px; padding: 14px 18px; border-radius: 6px; border: 1px solid #e2e8f0; }
    .post-list a { text-decoration: none; color: #0066cc; font-weight: bold; font-size: 1.05rem; }
    .date { color: #666; font-size: 0.85rem; display: block; }
  </style>
</head>
<body>
  <h1>{{ .Site.Title }}</h1>
  <p>毎朝の同人誌・即売会・クリエイター関連の最新ニュースまとめ</p>
  <ul class="post-list">
    {{ range .Site.RegularPages }}
      <li>
        <span class="date">{{ .Date.Format "2006-01-02" }}</span>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </li>
    {{ end }}
  </ul>
</body>
</html>
